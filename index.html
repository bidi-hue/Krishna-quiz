<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Krishna's Very Serious Quiz</title>

    <!-- Connects the design file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- START SCREEN -->
        <section id="start-screen" class="screen">
            <h1>Krishna, We Need To Talk.</h1>

            <p>
                You have been selected for a completely unnecessary
                investigation into your life choices.
            </p>

            <p class="warning">
                ⚠️ Answer honestly. We are judging you.
            </p>

            <button id="start-btn" type="button">
                Start the Investigation
            </button>
        </section>


        <!-- QUIZ SCREEN -->
        <section id="quiz-screen" class="screen hidden">

            <div class="progress">
                Question <span id="question-number">1</span>
                of <span id="total-questions">8</span>
            </div>

            <h2 id="question">
                Question goes here
            </h2>

            <div id="answers" class="answers">
                <!-- JavaScript will put the answer buttons here -->
            </div>

            <p id="reaction" class="reaction" aria-live="polite"></p>

            <button id="next-btn" type="button" class="hidden">
                Next Question →
            </button>

        </section>


        <!-- RESULT SCREEN -->
        <section id="result-screen" class="screen hidden">

            <h1>Investigation Complete.</h1>

            <p id="result-message"></p>

            <div class="score-box">
                <span id="score">0</span> / 8
            </div>

            <p id="final-roast"></p>

            <button id="restart-btn" type="button">
                Investigate Me Again
            </button>

        </section>

    </main>


    <!-- Connects the JavaScript file -->
    <script src="script.js"></script>

</body>
              </html>
